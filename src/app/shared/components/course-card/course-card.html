<div

  <div
    class="h-32"
    [class]="coverColor()">
  </div>

  <div class="p-6">

    <h3 class="text-xl font-bold text-gray-900">
      {{ title() }}
    </h3>

    <p class="mt-2 text-gray-500">
      {{ instructor() }}
    </p>

    <p class="mt-5 text-sm text-gray-600">
      {{ assignment() }}
    </p>

  </div>

</div>
