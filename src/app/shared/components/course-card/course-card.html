<div
  class="cursor-pointer overflow-hidden rounded-3xl bg-white shadow-lg transition-all duration-400 ease-out hover:-translate-y-1 hover:shadow-xl dark:bg-[#161b22] dark:shadow-black/30 dark:hover:shadow-black/50">

  <div
    class="h-32"
    [class]="coverColor()">
  </div>

  <div class="p-6">

    <h3 class="text-xl font-bold text-gray-900 transition-colors duration-300 dark:text-[#f0f6fc]">
      {{ title() }}
    </h3>

    <p class="mt-2 text-gray-500 transition-colors duration-300 dark:text-[#8b949e]">
      {{ instructor() }}
    </p>

    <p class="mt-5 text-sm text-gray-600 transition-colors duration-300 dark:text-[#c9d1d9]">
      {{ assignment() }}
    </p>

  </div>

</div>
