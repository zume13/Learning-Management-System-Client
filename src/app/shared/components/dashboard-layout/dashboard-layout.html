<div class="flex h-screen flex-col overflow-hidden bg-gray-100 duration-300 dark:bg-[#010409]">

  <header
    class="flex h-16 items-center justify-between border-b border-gray-200 bg-white px-8 transition-colors duration-300 dark:border-[#30363d] dark:bg-[#0d1117]">

    <div class="flex items-center">

      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 font-bold text-white">

        C

      </div>

      <h1 class="ml-3 text-2xl font-bold text-indigo-600">
        Classy
      </h1>

    </div>

    <div class="flex items-center">

      <button
        class="relative mr-8 cursor-pointer text-gray-600 transition hover:text-gray-900 dark:text-[#8b949e] dark:hover:text-white"
        aria-label="Notifications">

        <svg
          lucideBell
          class="h-5 w-5">
        </svg>

      </button>

      <div class="relative">

        <button
          (click)="toggleDropdown()"
          class="flex cursor-pointer items-center gap-3"
          aria-label="User menu">

          <div
            class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-100 font-bold text-indigo-600 dark:bg-[#1f2937] dark:text-indigo-400">

            JD

          </div>

          <span class="font-medium text-gray-700 dark:text-[#c9d1d9]">
            Juan Dela Cruz
          </span>

          <svg
            lucideChevronDown
            class="h-4 w-4 text-gray-500 dark:text-[#8b949e]">
          </svg>

        </button>

        @if (showDropdown) {

          <div
            class="absolute right-0 mt-3 w-56 overflow-hidden rounded-xl bg-white shadow-xl dark:bg-[#161b22] dark:ring-1 dark:ring-[#30363d]">

            <a
              class="flex cursor-pointer items-center gap-3 px-6 py-4 text-gray-700 transition hover:bg-gray-100 dark:text-[#c9d1d9] dark:hover:bg-[#21262d]">

              <svg
                lucideUser
                class="h-5 w-5 text-gray-500 dark:text-[#8b949e]">
              </svg>

              Profile

            </a>


            <a
              class="flex cursor-pointer items-center gap-3 px-6 py-4 text-gray-700 transition hover:bg-gray-100 dark:text-[#c9d1d9] dark:hover:bg-[#21262d]">

              <svg
                lucideSettings
                class="h-5 w-5 text-gray-500 dark:text-[#8b949e]">
              </svg>

              Settings

            </a>


            <div class="border-t border-gray-200 dark:border-[#30363d]"></div>


            <button
              class="flex w-full cursor-pointer items-center gap-3 px-6 py-4 text-left text-red-600 transition hover:bg-red-50 dark:hover:bg-[#21262d]">

              <svg
                lucideLogOut
                class="h-5 w-5">
              </svg>

              Log Out

            </button>

          </div>

        }

      </div>

    </div>

  </header>

  <div class="flex min-h-0 flex-1">

  <aside
    class="relative flex h-full shrink-0 flex-col border-r border-gray-200 bg-white transition-all duration-300 ease-in-out dark:border-[#30363d] dark:bg-[#0d1117]"
    [class.w-64]="!sidebarCollapsed"
    [class.w-20]="sidebarCollapsed">

    <nav class="mt-6 flex-1">

      <a
        routerLink="/dashboard"
        routerLinkActive="bg-indigo-100 font-semibold text-indigo-600 dark:bg-[#21262d] dark:text-indigo-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex h-14 cursor-pointer items-center text-gray-600 transition hover:bg-gray-100 hover:text-gray-900 dark:text-[#c9d1d9] dark:hover:bg-[#21262d] dark:hover:text-white">

        <span
          class="absolute left-0 flex h-14 w-20 items-center justify-center">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m2.25 12 8.954-8.954a1.125 1.125 0 0 1 1.592 0L21.75 12M4.5 9.75v10.125A1.125 1.125 0 0 0 5.625 21h4.125v-5.25h4.5V21h4.125a1.125 1.125 0 0 0 1.125-1.125V9.75" />

          </svg>

        </span>

        @if (!sidebarCollapsed) {
          <span class="absolute left-20 ml-3 whitespace-nowrap">
            Dashboard
          </span>
        }

      </a>

      <a
        routerLink="/todo"
        routerLinkActive="bg-indigo-100 font-semibold text-indigo-600 dark:bg-[#21262d] dark:text-indigo-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex h-14 cursor-pointer items-center text-gray-600 transition hover:bg-gray-100 hover:text-gray-900 dark:text-[#c9d1d9] dark:hover:bg-[#21262d] dark:hover:text-white">

        <span
          class="absolute left-0 flex h-14 w-20 items-center justify-center">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />

          </svg>

        </span>

        @if (!sidebarCollapsed) {
          <span class="absolute left-20 ml-3 whitespace-nowrap">
            To-Do
          </span>
        }

      </a>

      <a
        routerLink="/calendar"
        routerLinkActive="bg-indigo-100 font-semibold text-indigo-600 dark:bg-[#21262d] dark:text-indigo-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex h-14 cursor-pointer items-center text-gray-600 transition hover:bg-gray-100 hover:text-gray-900 dark:text-[#c9d1d9] dark:hover:bg-[#21262d] dark:hover:text-white">

        <span
          class="absolute left-0 flex h-14 w-20 items-center justify-center">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.75 3v2.25M17.25 3v2.25M3.75 9h16.5M5.25 5.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V7.5A2.25 2.25 0 0 1 5.25 5.25Z" />

          </svg>

        </span>

        @if (!sidebarCollapsed) {
          <span class="absolute left-20 ml-3 whitespace-nowrap">
            Calendar
          </span>
        }

      </a>

    </nav>

    <button
      type="button"
      (click)="toggleTheme()"
      class="relative flex h-14 w-full shrink-0 cursor-pointer items-center text-gray-600 transition hover:bg-gray-100 hover:text-gray-900 dark:text-[#c9d1d9] dark:hover:bg-[#21262d] dark:hover:text-white"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">

      <span
        class="absolute left-0 flex h-14 w-20 items-center justify-center">

        @if (isDarkMode) {

          <svg
            lucideSun
            class="h-5 w-5">
          </svg>

        } @else {

          <svg
            lucideMoon
            class="h-5 w-5">
          </svg>

        }

      </span>

      @if (!sidebarCollapsed) {
        <span class="absolute left-20 ml-3 whitespace-nowrap">
          {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
        </span>
      }

    </button>

    <button
      type="button"
      (click)="toggleSidebar()"
      class="absolute right-0 top-1/2 z-10 flex h-10 w-5 -translate-y-1/2 translate-x-1/2 cursor-pointer items-center justify-center rounded-full border border-gray-200 bg-white text-gray-400 shadow-sm transition hover:text-gray-700 dark:border-[#30363d] dark:bg-[#21262d] dark:text-[#8b949e] dark:hover:text-white"
      [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">

      @if (sidebarCollapsed) {

        <svg
          lucideChevronRight
          class="h-4 w-4">
        </svg>

      } @else {
        
        <svg
          lucideChevronLeft
          class="h-4 w-4">
        </svg>

      }

    </button>

  </aside>


  <main
    class="flex-1 overflow-y-auto shadow-[-4px_4px_12px_rgba(0,0,0,0.08)] transition-shadow duration-300 dark:shadow-[-4px_4px_12px_rgba(0,0,0,0.35)]">

    <router-outlet />

  </main>

</div>

</div>
