<div class="h-screen overflow-y-auto bg-gray-100 p-8">

    <div class="bg-white rounded-xl shadow p-6 mb-6">

        <h1 class="text-3xl font-bold text-gray-800">
            {{ title }}
        </h1>

        <p class="text-gray-500 mt-2">
            {{ description }}
        </p>

    </div>

    <div class="space-y-8">

        <section>

            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                Module 1: Introduction to Programming
            </h2>

            <div class=" rounded-xl shadow-sm border p-5 mb-4">

                <div class="flex justify-between">

                    <div>
                        <h3 class="font-semibold text-lg">
                            Activity 1: Create your first HTML page
                        </h3>

                        <p class="text-gray-500 text-sm mt-2">
                            Create a basic HTML page using HTML tags.
                        </p>

                        <p class="text-red-600 text-sm mt-3">
                            Due: Tomorrow
                        </p>

                    </div>

                    <button
                        class="bg-indigo-600 text-white px-5 py-2 rounded-lg">
                        View
                    </button>

                </div>

            </div>

        </section>

    </div>

</div>
