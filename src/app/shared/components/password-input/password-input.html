<div class="flex flex-col gap-2">
  <label class="font-semibold text-gray-700">
    {{ label() }}
  </label>

  <div class="flex gap-2">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      class="min-w-0 flex-1 rounded-lg border border-gray-300 px-4 py-3 text-gray-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

    <button
      type="button"
      (click)="togglePassword()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      class="flex items-center justify-center rounded-lg border border-gray-300 px-4 text-gray-500 transition hover:bg-gray-50 hover:text-gray-700">

      @if (showPassword()) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="h-5 w-5">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5c4.64 0 8.577 3.01 9.964 7.178.07.21.07.433 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.64 0-8.577-3.01-9.964-7.178Z" />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="h-5 w-5">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.98 8.223A10.477 10.477 0 0 0 2.036 12.322a1.012 1.012 0 0 0 0 .644C3.423 17.49 7.36 20.5 12 20.5c1.902 0 3.69-.503 5.23-1.385M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.64 0 8.577 3.01 9.964 7.178a1.012 1.012 0 0 1 0 .644 10.5 10.5 0 0 1-4.132 5.17M6.228 6.228 3 3m3.228 3.228 3.152 3.152m0 0a3 3 0 1 0 4.243 4.243m-4.243-4.243 4.243 4.243m0 0 3.15 3.15M9.38 9.38 5.23 5.23" />
        </svg>
      }
    </button>
  </div>
</div>
