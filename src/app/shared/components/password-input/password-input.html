<div class="flex flex-col gap-2">
  <label class="font-semibold text-gray-700">
    {{ label() }}
  </label>

  <div class="flex gap-2">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      class="min-w-0 flex-1 rounded-lg border border-gray-300 px-4 py-3 text-gray-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

    <button
      type="button"
      (click)="togglePassword()"
      class="rounded-lg border border-gray-300 px-4 transition hover:bg-gray-50">
      {{ showPassword() ? '🙈' : '👁️' }}
    </button>
  </div>
</div>
