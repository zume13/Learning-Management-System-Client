<div class="min-h-full bg-gray-50 p-10 text-gray-900 dark:bg-[#080b0f] dark:text-[#f0f6fc]">

  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-4xl font-bold text-gray-900 dark:text-[#f0f6fc]">
        To-Do
      </h1>

      <p class="mt-2 text-gray-500 dark:text-[#8b949e]">
        Keep track of your assignments and upcoming tasks.
      </p>
    </div>

  </div>


  <div class="mt-8 flex gap-3">

    <button
      (click)="setFilter('all')"
      class="cursor-pointer rounded-lg px-5 py-2 transition-colors duration-300"
      [class.bg-indigo-100]="activeFilter === 'all'"
      [class.font-semibold]="activeFilter === 'all'"
      [class.text-indigo-600]="activeFilter === 'all'"
      [class.dark:bg-[#1f2937]]="activeFilter === 'all'"
      [class.dark:text-indigo-400]="activeFilter === 'all'"
      [class.text-gray-600]="activeFilter !== 'all'"
      [class.dark:text-[#8b949e]]="activeFilter !== 'all'"
      [class.hover:bg-gray-100]="activeFilter !== 'all'"
      [class.dark:hover:bg-[#21262d]]="activeFilter !== 'all'">

      All

    </button>

    <button
      (click)="setFilter('pending')"
      class="cursor-pointer rounded-lg px-5 py-2 transition-colors duration-300"
      [class.bg-indigo-100]="activeFilter === 'pending'"
      [class.font-semibold]="activeFilter === 'pending'"
      [class.text-indigo-600]="activeFilter === 'pending'"
      [class.dark:bg-[#1f2937]]="activeFilter === 'pending'"
      [class.dark:text-indigo-400]="activeFilter === 'pending'"
      [class.text-gray-600]="activeFilter !== 'pending'"
      [class.dark:text-[#8b949e]]="activeFilter !== 'pending'"
      [class.hover:bg-gray-100]="activeFilter !== 'pending'"
      [class.dark:hover:bg-[#21262d]]="activeFilter !== 'pending'">

      Pending

    </button>

    <button
      (click)="setFilter('completed')"
      class="cursor-pointer rounded-lg px-5 py-2 transition-colors duration-300"
      [class.bg-indigo-100]="activeFilter === 'completed'"
      [class.font-semibold]="activeFilter === 'completed'"
      [class.text-indigo-600]="activeFilter === 'completed'"
      [class.dark:bg-[#1f2937]]="activeFilter === 'completed'"
      [class.dark:text-indigo-400]="activeFilter === 'completed'"
      [class.text-gray-600]="activeFilter !== 'completed'"
      [class.dark:text-[#8b949e]]="activeFilter !== 'completed'"
      [class.hover:bg-gray-100]="activeFilter !== 'completed'"
      [class.dark:hover:bg-[#21262d]]="activeFilter !== 'completed'">

      Completed

    </button>

  </div>


  <div
    class="mt-6 overflow-hidden rounded-2xl bg-white shadow transition-colors duration-300 dark:bg-[#161b22]">


    @for (task of filteredTasks; track task.title) {

  <div
    class="flex items-center justify-between border-gray-200 px-6 py-5 transition-colors duration-300 hover:bg-gray-50 dark:border-[#30363d] dark:hover:bg-[#21262d]"
    [class.border-b]="!$last">

    <div class="flex items-center gap-4">

      <button
        type="button"
        (click)="toggleTask(task)"
        class="flex h-5 w-5 cursor-pointer items-center justify-center rounded border-2 text-sm transition-colors duration-300"
        [class.border-gray-300]="!task.completed"
        [class.hover:border-indigo-500]="!task.completed"
        [class.dark:border-[#484f58]]="!task.completed"
        [class.dark:hover:border-indigo-400]="!task.completed"
        [class.border-indigo-600]="task.completed"
        [class.bg-indigo-600]="task.completed"
        [class.text-white]="task.completed"
        [class.dark:border-indigo-500]="task.completed"
        [class.dark:bg-indigo-500]="task.completed">

        @if (task.completed) {
          ✓
        }

      </button>

      <div>

        <h2
          class="font-semibold"
          [class.text-gray-900]="!task.completed"
          [class.text-gray-400]="task.completed"
          [class.dark:text-[#f0f6fc]]="!task.completed"
          [class.dark:text-[#8b949e]]="task.completed"
          [class.line-through]="task.completed">

          {{ task.title }}

        </h2>

        <p class="mt-1 text-sm text-gray-500 dark:text-[#8b949e]">
          {{ task.subject }}
        </p>

      </div>

    </div>

    <div class="text-right">

      <p
        class="text-sm font-medium"
        [class.text-red-600]="!task.completed && task.priority === 'High Priority'"
        [class.dark:text-red-400]="!task.completed && task.priority === 'High Priority'"
        [class.text-orange-500]="!task.completed && task.priority === 'Medium Priority'"
        [class.dark:text-orange-400]="!task.completed && task.priority === 'Medium Priority'"
        [class.text-green-600]="task.completed"
        [class.dark:text-green-400]="task.completed">

        {{ task.completed ? 'Completed' : task.due }}

      </p>

      @if (!task.completed) {

        <p class="mt-1 text-xs text-gray-400 dark:text-[#8b949e]">
          {{ task.priority }}
        </p>

      }

    </div>

  </div>

}

  </div>

</div>
